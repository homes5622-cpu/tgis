<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 음성 → 영어 번역 + 음성 출력</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:#f4f5f7; margin:0; padding:24px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:980px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.12); margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  button { border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  #startBtn { background:#2563eb; color:#fff; }
  #startBtn.recording { background:#dc2626; }
  #checkBtn { background:#059669; color:#fff; }
  #clearBtn,#copyBtn,#stopTtsBtn,#testBtn { background:#e5e7eb; color:#111; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select { padding:9px; border-radius:8px; border:1px solid #d1d5db; font-size:14px; max-width:260px; }
  label.chk { font-size:13px; color:#374151; display:flex; align-items:center; gap:5px; cursor:pointer; }
  input[type=range] { width:110px; }
  #status { font-size:13px; color:#6b7280; margin-left:auto; }

  .meter-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .meter-label { font-size:12px; color:#6b7280; width:58px; }
  .meter { flex:1; height:14px; background:#e5e7eb; border-radius:999px; overflow:hidden; }
  .meter-fill { height:100%; width:0%; background:linear-gradient(90deg,#22c55e,#eab308,#dc2626); transition:width .06s; }
  .meter-val { font-size:12px; color:#6b7280; width:42px; text-align:right; }

  .panes { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:680px){ .panes{grid-template-columns:1fr;} }
  .pane h2 { font-size:13px; color:#6b7280; margin:0 0 6px; font-weight:600; }
  .box { min-height:200px; max-height:360px; overflow-y:auto; padding:14px; border:1px solid #d1d5db;
    border-radius:8px; font-size:15px; line-height:1.8; white-space:pre-wrap; }
  #enBox { background:#f0f9ff; }
  .interim { color:#9ca3af; }
  .pending { color:#9ca3af; font-style:italic; }
  .failed { color:#b91c1c; background:#fee2e2; border-radius:3px; padding:0 2px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#dc2626; margin-right:6px; animation:blink 1s infinite; }
  @keyframes blink{50%{opacity:.2;}}
  .badge { font-size:11px; padding:3px 8px; border-radius:999px; background:#e5e7eb; color:#374151; }
  .badge.ok{background:#dcfce7;color:#166534;} .badge.warn{background:#fef3c7;color:#92400e;}
  .badge.net{background:#dbeafe;color:#1e40af;}
  #log { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.6;
    background:#111827; color:#d1d5db; padding:12px; border-radius:8px; height:160px; overflow-y:auto; }
  #log .e{color:#fca5a5;} #log .ok{color:#86efac;} #log .w{color:#fcd34d;} #log .t{color:#6b7280;}
  .diag { font-size:13px; line-height:1.9; margin:0; padding-left:18px; }
  .hint { font-size:12px; color:#92400e; background:#fffbeb; border:1px solid #fde68a;
    border-radius:8px; padding:10px 12px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>한국어 음성 → 영어 번역 → 영어 음성 출력</h1>

  <div class="card">
    <div class="row">
      <button id="checkBtn">① 마이크 진단</button>
      <button id="startBtn">② 녹음 시작</button>
      <button id="testBtn">번역 테스트</button>
      <button id="clearBtn">지우기</button>
      <button id="copyBtn">영문 복사</button>
      <button id="stopTtsBtn">음성 정지</button>
      <span class="badge" id="engineBadge">번역 엔진 확인 중</span>
      <span id="status">대기 중</span>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="ttsOn" checked> 영어 음성 읽기(TTS)</label>
      <select id="voiceSel"><option>음성 로딩 중...</option></select>
      <label class="chk">속도 <input type="range" id="rate" min="0.5" max="1.6" step="0.1" value="1"><span id="rateVal">1.0</span></label>
      <label class="chk"><input type="checkbox" id="duckOn" checked> 읽는 동안 인식 일시정지</label>
      <label class="chk"><input type="checkbox" id="remoteOn" checked> 원격 번역 폴백 허용</label>
    </div>

    <div class="row">
      <span style="font-size:12px;color:#6b7280;">입력 장치</span>
      <select id="micSel"><option>진단 후 표시됩니다</option></select>
    </div>

    <div class="meter-row">
      <span class="meter-label">입력 음량</span>
      <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
      <span class="meter-val" id="meterVal">0</span>
    </div>

    <ul class="diag" id="diag"></ul>
    <div class="hint">
      스피커로 들으면 영어 음성이 마이크에 다시 들어가 오인식됩니다. <b>이어폰 사용</b>을 권장하며,
      그게 어려우면 <b>“읽는 동안 인식 일시정지”</b>를 켜두세요.<br>
      번역 결과에 <b>한글이 남아 있으면 TTS를 건너뜁니다</b>(영어 음성이 한글을 이상하게 읽는 현상 방지).
    </div>
  </div>

  <div class="card">
    <div class="panes">
      <div class="pane"><h2>🇰🇷 인식된 한국어</h2><div class="box" id="koBox"></div></div>
      <div class="pane"><h2>🇺🇸 영어 번역 (드래그 선택 시 다시 읽기)</h2><div class="box" id="enBox"></div></div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:13px;color:#6b7280;margin:0 0 8px;">이벤트 로그</h2>
    <div id="log"></div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const HANGUL = /[가-힣ㄱ-ㅎㅏ-ㅣ]/;

  function log(msg, cls) {
    const t = new Date().toLocaleTimeString('ko-KR',{hour12:false});
    const d = document.createElement('div');
    d.innerHTML = `<span class="t">${t}</span> <span class="${cls||''}">${msg}</span>`;
    $('log').appendChild(d); $('log').scrollTop = 1e6;
  }
  function addDiag(ok, text){
    const li=document.createElement('li');
    li.innerHTML = (ok?'✅ ':'❌ ')+text;
    li.style.color = ok?'#166534':'#991b1b';
    $('diag').appendChild(li);
  }

  const isSecure = window.isSecureContext;
  addDiag(isSecure, isSecure ? `보안 컨텍스트 OK (${location.protocol}//${location.hostname||'-'})`
    : '보안 컨텍스트 아님 — <b>file:// 로는 동작 안 함.</b> localhost 서버로 여세요');
  addDiag(!!SR, SR?'SpeechRecognition 지원':'SpeechRecognition 미지원 (Chrome/Edge 필요)');
  addDiag(!!window.speechSynthesis, window.speechSynthesis?'speechSynthesis(TTS) 지원':'TTS 미지원');

  if (!SR) { $('startBtn').disabled=true; $('checkBtn').disabled=true; }

  /* ================= 번역 엔진 ================= */
  let translator=null, engineMode='dict';
  const DICT={'안녕하세요':'Hello','감사합니다':'Thank you','네':'Yes','아니요':'No','오늘':'today',
    '내일':'tomorrow','회의':'meeting','시작':'start','종료':'end','저는':'I','우리':'we',
    '좋아요':'good','문제':'problem','질문':'question','프로젝트':'project'};

  const badge = $('engineBadge');
  function setBadge(txt, cls){ badge.textContent = txt; badge.className = 'badge '+(cls||''); }

  (async function initTranslator(){
    const T = self.Translator || window.Translator;
    if(!T){
      setBadge('내장 번역 없음 → 원격 폴백','net');
      addDiag(false, '내장 Translator API 없음 — Chrome/Edge 138+ 및 https/localhost 필요');
      log('Translator API 없음 → 원격 번역 사용','w');
      return;
    }
    try{
      const a = await T.availability({sourceLanguage:'ko',targetLanguage:'en'});
      log('Translator availability: '+a);
      if(a==='unavailable') throw new Error('ko→en 미지원');
      translator = await T.create({ sourceLanguage:'ko', targetLanguage:'en',
        monitor(m){ m.addEventListener('downloadprogress',e=>{
          setBadge(`언어팩 ${Math.round(e.loaded*100)}%`,'warn'); }); }});
      engineMode='builtin';
      setBadge('✓ 내장 번역','ok');
      addDiag(true, '내장 Translator(ko→en) 준비 완료');
      log('Translator 준비 완료','ok');
    }catch(e){
      setBadge('내장 실패 → 원격 폴백','net');
      addDiag(false, '내장 Translator 실패: '+e.message);
      log('Translator 실패: '+e.message,'w');
    }
  })();

  const dictT = t => t.trim().split(/\s+/)
    .map(w=>DICT[w.replace(/[.,!?]/g,'')]||w).join(' ');

  // 원격 폴백: MyMemory (API 키 불필요)
  async function remoteT(text){
    const url = 'https://api.mymemory.translated.net/get?q='
      + encodeURIComponent(text) + '&langpair=ko|en';
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    try{
      const res = await fetch(url, {signal:ctrl.signal});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j = await res.json();
      const out = (j && j.responseData && j.responseData.translatedText || '').trim();
      if(!out) throw new Error('빈 응답');
      if(HANGUL.test(out)) throw new Error('한글 잔존');
      return out;
    } finally { clearTimeout(timer); }
  }

  // 반환: {text, ok} — ok=false면 번역 실패(한글 잔존)
  async function translate(t){
    if(engineMode==='builtin' && translator){
      try{
        const out = (await translator.translate(t) || '').trim();
        if(out && !HANGUL.test(out)) return {text:out, ok:true};
        log('내장 번역 결과에 한글 잔존 → 원격 폴백','w');
      }catch(e){ log('내장 번역 오류: '+e.message,'w'); }
    }
    if($('remoteOn').checked){
      try{
        const out = await remoteT(t);
        log('원격 번역 성공','ok');
        return {text:out, ok:true};
      }catch(e){ log('원격 번역 실패: '+e.message,'e'); }
    }
    const d = dictT(t);
    return {text:d, ok:!HANGUL.test(d)};
  }

  /* ================= TTS ================= */
  const synth = window.speechSynthesis;
  let voices=[], ttsSpeaking=false;

  function loadVoices(){
    if(!synth) return;
    voices = synth.getVoices().filter(v=>/^en/i.test(v.lang));
    if(!voices.length){ $('voiceSel').innerHTML='<option>영어 음성 없음</option>'; return; }
    $('voiceSel').innerHTML = voices.map((v,i)=>
      `<option value="${i}"${/en-US/i.test(v.lang)&&i<3?' selected':''}>${v.name} (${v.lang})</option>`).join('');
    log(`영어 TTS 음성 ${voices.length}개 로드`,'ok');
  }
  loadVoices();
  if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

  setInterval(()=>{ if(synth && synth.speaking && !synth.paused) { synth.pause(); synth.resume(); } }, 9000);

  function speak(text){
    if(!$('ttsOn').checked || !text || !text.trim() || !synth) return;
    // ★ 번역 실패분(한글 포함)은 읽지 않음 — 영어 음성이 한글을 오발음하는 현상 차단
    if(HANGUL.test(text)){
      log('번역 미완료(한글 포함) → TTS 생략: "'+text.slice(0,30)+'"','w');
      return;
    }
    const u = new SpeechSynthesisUtterance(text);
    const vi = parseInt($('voiceSel').value,10);
    if(voices[vi]) { u.voice = voices[vi]; u.lang = voices[vi].lang; }
    else u.lang = 'en-US';
    u.rate = parseFloat($('rate').value);
    u.pitch = 1;

    u.onstart = () => {
      ttsSpeaking = true;
      log('🔊 읽는 중: "'+text.slice(0,40)+'"','ok');
      if($('duckOn').checked && recording && recognition){
        suspended = true;
        try{ recognition.abort(); }catch(_){}
        $('status').innerHTML='🔊 읽는 중 (인식 일시정지)';
      }
    };
    u.onend = () => {
      ttsSpeaking = false;
      if(suspended && recording){
        suspended = false;
        setTimeout(()=>safeStart('TTS 종료 후 복귀'), 300);
      }
    };
    u.onerror = e => { ttsSpeaking=false; suspended=false; log('TTS 오류: '+e.error,'e'); };
    synth.speak(u);
  }

  $('rate').addEventListener('input', ()=> $('rateVal').textContent = parseFloat($('rate').value).toFixed(1));
  $('stopTtsBtn').addEventListener('click', ()=>{
    if(synth) synth.cancel();
    ttsSpeaking=false;
    if(suspended && recording){ suspended=false; safeStart('TTS 취소 후 복귀'); }
    log('TTS 중지');
  });
  $('enBox').addEventListener('mouseup', ()=>{
    const sel = window.getSelection().toString().trim();
    if(sel) speak(sel);
  });

  // 번역 파이프라인 단독 테스트
  $('testBtn').addEventListener('click', async ()=>{
    const sample = '안녕하세요. 오늘 회의는 세 시에 시작합니다.';
    log('번역 테스트 입력: '+sample);
    const r = await translate(sample);
    log('번역 테스트 결과: '+r.text, r.ok?'ok':'e');
    koFinal += sample+'\n'; renderKo('');
    appendEn(r);
  });

  /* ================= 마이크 진단 / 음량 미터 ================= */
  let audioCtx=null, meterStream=null, rafId=null;

  function stopMeter(){
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx=null; }
    if(meterStream){ meterStream.getTracks().forEach(t=>t.stop()); meterStream=null; }
    $('meterFill').style.width='0%'; $('meterVal').textContent='0';
  }

  function startMeter(s){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const an = audioCtx.createAnalyser(); an.fftSize=1024;
    audioCtx.createMediaStreamSource(s).connect(an);
    const buf = new Uint8Array(an.fftSize);
    (function loop(){
      an.getByteTimeDomainData(buf);
      let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; }
      const pct = Math.min(100, Math.sqrt(sum/buf.length)*320);
      $('meterFill').style.width=pct+'%'; $('meterVal').textContent=Math.round(pct);
      rafId = requestAnimationFrame(loop);
    })();
  }

  async function checkMic(){
    $('checkBtn').disabled=true;
    try{
      meterStream = await navigator.mediaDevices.getUserMedia({
        audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }});
      const track = meterStream.getAudioTracks()[0];
      addDiag(true, `마이크 연결됨: <b>${track.label||'이름 없음'}</b>`);
      log('getUserMedia 성공: '+track.label,'ok');
      const mics = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
      $('micSel').innerHTML = mics.map((m,i)=>`<option value="${m.deviceId}">${m.label||('마이크 '+(i+1))}</option>`).join('');
      startMeter(meterStream);
      $('status').textContent='진단 완료 — 말해보고 음량 바를 확인하세요';
    }catch(e){
      addDiag(false, `마이크 접근 실패: ${e.name} — ${
        e.name==='NotAllowedError'?'권한 차단. 주소창 🔒 → 마이크 → 허용 후 새로고침':
        e.name==='NotFoundError'?'연결된 마이크 없음':
        e.name==='NotReadableError'?'다른 앱(Zoom/Teams 등)이 마이크 점유 중':e.message}`);
      log('getUserMedia 실패: '+e.name,'e');
    }
    $('checkBtn').disabled=false;
  }
  $('checkBtn').addEventListener('click', checkMic);
  $('micSel').addEventListener('change', async ()=>{
    stopMeter();
    meterStream = await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:$('micSel').value}}});
    startMeter(meterStream);
    log('입력 장치 변경: '+$('micSel').selectedOptions[0].text,'ok');
  });

  /* ================= 음성 인식 ================= */
  let recognition=null;
  let recording=false;
  let suspended=false;
  let starting=false;
  let koFinal='', enHtml='';
  let restarts=0, lastEvent=Date.now(), watchdog=null;
  let queue = Promise.resolve();
  const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  const renderKo = i => { $('koBox').innerHTML = esc(koFinal)+(i?`<span class="interim">${esc(i)}</span>`:''); $('koBox').scrollTop=1e6; };
  const renderEn = p => { $('enBox').innerHTML = enHtml+(p?`<span class="pending">${esc(p)}</span>`:''); $('enBox').scrollTop=1e6; };

  function appendEn(r){
    enHtml += r.ok ? esc(r.text)+'\n'
                   : `<span class="failed">[번역 실패] ${esc(r.text)}</span>\n`;
    renderEn('');
    speak(r.text);
  }

  function enqueue(s){
    renderEn('번역 중...');
    queue = queue.then(async ()=>{
      const r = await translate(s);
      appendEn(r);
    }).catch(e=>log('번역 실패: '+e.message,'e'));
  }

  function build(){
    const r = new SR();
    r.lang='ko-KR'; r.continuous=true; r.interimResults=true; r.maxAlternatives=1;

    r.onaudiostart  = ()=>{ lastEvent=Date.now(); log('오디오 캡처 시작'); };
    r.onspeechstart = ()=>{ lastEvent=Date.now(); log('음성 감지','ok'); };

    r.onstart = ()=>{
      starting=false; lastEvent=Date.now();
      $('startBtn').textContent='⏹ 녹음 중지';
      $('startBtn').classList.add('recording');
      $('status').innerHTML='<span class="dot"></span>듣는 중...';
      log('세션 시작 (재시작 '+restarts+'회)','ok');
    };

    r.onresult = e=>{
      lastEvent=Date.now();
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal){
          const s=t.trim();
          if(s){ koFinal+=s+'\n'; enqueue(s); log('확정: "'+s+'"','ok'); }
        } else interim+=t;
      }
      renderKo(interim);
    };

    r.onnomatch = ()=> log('인식 결과 없음','w');

    r.onerror = e=>{
      starting=false;
      const fatal = ['not-allowed','service-not-allowed','audio-capture'];
      const map={
        'not-allowed':'권한 거부 — 주소창 🔒 → 마이크 허용 후 새로고침',
        'service-not-allowed':'음성 서비스 차단됨',
        'audio-capture':'마이크를 찾을 수 없음',
        'no-speech':'무음 타임아웃 — 자동 재시작',
        'network':'네트워크 오류 — 자동 재시도',
        'aborted':'세션 중단됨 (정상적인 재시작 과정일 수 있음)'
      };
      log('ERROR: '+(map[e.error]||e.error), fatal.includes(e.error)?'e':'w');
      if(fatal.includes(e.error)){ recording=false; stopUI(); }
    };

    r.onend = ()=>{
      starting=false;
      log('세션 종료 (recording='+recording+', suspended='+suspended+')');
      if(recording && !suspended && !ttsSpeaking){
        restarts++;
        setTimeout(()=>safeStart('onend 자동 재시작'), 300);
      } else if(!recording){
        stopUI();
      }
    };
    return r;
  }

  function safeStart(reason){
    if(!recording || starting || suspended) return;
    if(!recognition) recognition = build();
    starting = true;
    try{
      recognition.start();
      log('start() 호출 — '+reason);
    }catch(err){
      starting=false;
      if(err.name==='InvalidStateError'){ log('이미 실행 중 (무시)','w'); return; }
      log('start 실패: '+err.name+' → 객체 재생성','e');
      try{ recognition.abort(); }catch(_){}
      recognition = build();
      setTimeout(()=>{ if(recording){ starting=true; try{ recognition.start(); }catch(e2){ starting=false; log('재시도 실패: '+e2.name,'e'); recording=false; stopUI(); } } }, 500);
    }
  }

  function stopUI(){
    $('startBtn').textContent='🎤 녹음 시작';
    $('startBtn').classList.remove('recording');
    $('status').textContent='정지됨';
    renderKo('');
    if(watchdog){ clearInterval(watchdog); watchdog=null; }
  }

  $('startBtn').addEventListener('click', ()=>{
    if(!recording){
      recording = true; suspended = false; restarts = 0; lastEvent = Date.now();
      if(meterStream){ stopMeter(); log('진단 스트림 해제 (마이크 점유 충돌 방지)','w'); }
      if(recognition){ try{ recognition.abort(); }catch(_){} recognition=null; }
      recognition = build();
      $('status').textContent='시작하는 중...';
      safeStart('사용자 클릭');

      watchdog = setInterval(()=>{
        if(!recording || suspended || ttsSpeaking) return;
        if(Date.now() - lastEvent > 12000){
          log('워치독: 응답 없음 → 세션 재생성','w');
          lastEvent = Date.now();
          try{ recognition.abort(); }catch(_){}
          recognition = build(); starting=false;
          safeStart('워치독 복구');
        }
      }, 3000);
    } else {
      recording=false; suspended=false;
      if(recognition){ try{ recognition.stop(); }catch(_){} }
      if(synth) synth.cancel();
      stopUI();
      log('사용자 정지');
    }
  });

  $('clearBtn').addEventListener('click', ()=>{ koFinal=''; enHtml=''; renderKo(''); renderEn(''); });
  $('copyBtn').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText($('enBox').innerText.trim()); $('status').textContent='복사됨'; }
    catch(_){ log('복사 실패','e'); }
  });

  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && recording && !suspended){
      log('탭 복귀 → 세션 점검','w'); safeStart('탭 복귀');
    }
  });
})();
</script>
</body>
</html>
